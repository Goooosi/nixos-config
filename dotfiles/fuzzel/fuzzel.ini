

[main]
font=Maple Mono:size=12
terminal=kitty
icon-theme=hicolor
show-actions=no
lines=8
width=40
tabs=4
horizontal-pad=12
vertical-pad=12
inner-pad=6
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=yes
layer=overlay
anchor=center
location=center

prompt="❯ "
placeholder="Search | 검색 | Поиск | Sök"

[colors]
background=1c2124ff       
text=ffffffff             
prompt=ffffffff           
input=ffffffff            
match=efcb69ff            
selection=414e54ff        
selection-text=ffeb89ff   
selection-match=efcb69ff  
border=414e54ff           

placeholder=737f84ff

[border]
width=2
radius=14

[drun]
filter-desktop=yes
