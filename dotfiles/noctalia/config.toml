[backdrop]
blur_intensity = 0.0
enabled = true
tint_intensity = 0.24999999441206455

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.74999998323619366
    capsule = false
    capsule_border = "primary"
    capsule_fill = "surface"
    capsule_foreground = "on_surface"
    center = [ "workspaces" ]
    color = "primary"
    end = [ "tray", "notifications", "session", "launcher" ]
    font_family = "Maple Mono"
    icon_color = "error"
    layer = "top"
    margin_edge = 3
    margin_ends = 4
    margin_opposite_edge = 2
    position = "left"
    scale = 1.2000000104308128
    smart_auto_hide = false
    start = [ "cat", "clock", "temp", "battery", "volume" ]
    widget_spacing = 15

[control_center]
hidden_tabs = [ "monitor", "power", "notifications", "screen-time" ]

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 360.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 300.0

[location]
address = "New York, United States"

