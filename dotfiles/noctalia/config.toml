[backdrop]
blur_intensity = 0.19999999552965164
enabled = true
tint_intensity = 0.24999999441206455

[bar.default]
background_opacity = 0.0
capsule = true
capsule_border = "primary"
capsule_fill = "surface"
capsule_foreground = "on_surface"
center = [ "cat", "clock" ]
color = "primary"
end = [ "tray", "temp", "notifications", "volume", "battery", "session" ]
font_family = "Maple Mono"
icon_color = "error"
layer = "top"
margin_edge = 3
margin_ends = 0
smart_auto_hide = false

[control_center]
hidden_tabs = [ "monitor", "power", "notifications", "screen-time" ]

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 360.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 300.0

[location]
address = "New York, United States"

[lockscreen]
blur_intensity = 0.99999997764825821

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 854.0
    cy = 948.0
    output = "eDP-1"
    placement_height = 1391.0
    placement_width = 2226.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.96999997831881046

[plugins]
enabled = [ "dotnetrob/cat" ]

[shell]
corner_radius_scale = 1.5000000223517418
font_family = "Maple Mono"

    [shell.panel]
    control_center_position = "center"
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    directory = "/home/zi/Pictures/Screenshots"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
custom_palette = "umbreon"
pure_black_dark = true
source = "custom"

[wallpaper]
directory = "/etc/nixos/assets"

    [wallpaper.default]
    path = "/etc/nixos/assets/wall9.jpg"

    [wallpaper.last]
    path = "/etc/nixos/assets/wall9.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/etc/nixos/assets/wall9.jpg"

[weather]
unit = "imperial"

[widget.active_window]
capsule = true
max_length = 145
title_scroll = "on_hover"

[widget.audio_visualizer]
capsule = true
color_2 = "secondary"

[widget.battery]
show_label = false

[widget.cat]
cat_color = "error"
cat_color_mode = "custom"
type = "dotnetrob/cat:cat"

[widget.clock]
format = "{:%-I:%M %p %a, %b %d}"

[widget.control-center]
custom_image_colorize = true

[widget.launcher]
capsule = true
custom_image = "/etc/nixos/assets/Nix_snowflake.svg.webp"
custom_image_colorize = true
glyph = "accessible"

[widget.media]
capsule = true
capsule_radius = "auto"
hide_when_no_media = true
title_scroll = "on_hover"

[widget.workspaces]
capsule = true
empty_color = "error"
occupied_color = "error"
show_labels = false
