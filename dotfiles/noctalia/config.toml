[notification]
background_opacity = 0.96999997831881046

[plugin_settings."noctalia/mpvpaper"]
video_directory = "/etc/nixos/assets"

[plugins]
enabled = [ "dotnetrob/cat" ]

[shell]
corner_radius_scale = 1.5000000223517418
font_family = "Maple Mono"

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    category_icons_only = true
    compact = true
    layout = "simple"
    show_session_button = false
    show_settings_button = false

    [shell.panel]
    control_center_position = "center"
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = false

    [shell.screenshot]
    confirm_region = true
    directory = "/home/zi/Pictures/Screenshots"
    filename_pattern = "Screenshot %Y-%m-%d %H%M%S"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
community_palette = "Peche"
custom_palette = "umbreon"
mode = "dark"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    enable_builtin_templates = false

[wallpaper]
directory = "/etc/nixos/assets"

    [wallpaper.default]
    path = "/etc/nixos/assets/wallhaven-0p8wee.jpg"

    [wallpaper.last]
    path = "/etc/nixos/assets/wallhaven-0p8wee.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/etc/nixos/assets/wall9.jpg"

    [wallpaper.monitors.eDP-2]
    path = "/etc/nixos/assets/wallhaven-0p8wee.jpg"

[weather]
unit = "imperial"

[widget.active_window]
capsule = true
max_length = 145
title_scroll = "on_hover"

[widget.audio_visualizer]
capsule = true
color_2 = "secondary"

[widget.battery]
show_label = false

[widget.cat]
cat_color = "error"
cat_color_mode = "custom"
type = "dotnetrob/cat:cat"

[widget.cat_2]
type = "dotnetrob/cat:cat"

[widget.clock]
format = "{:%-I:%M %p %a, %b %d}"
vertical_format = "{:%m %d} - {:%I %M}"

[widget.control-center]
custom_image_colorize = true

[widget.launcher]
capsule = false
custom_image = "/etc/nixos/assets/Nix_snowflake.svg.webp"
custom_image_colorize = true
glyph = "accessible"

[widget.media]
capsule = false
capsule_radius = "auto"
hide_album_art = true
hide_when_no_media = true
title_scroll = "on_hover"

[widget.temp]
show_value = false
stat = "cpu_usage"

[widget.volume]
show_label = false

[widget.workspaces]
capsule = false
empty_color = "error"
occupied_color = "error"
show_labels = true
